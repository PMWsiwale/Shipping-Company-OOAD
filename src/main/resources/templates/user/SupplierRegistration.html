<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supplier Registration - FRAGIP LOGISTICS</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/properties.css}">
  <link rel="stylesheet" th:href="@{/css/supply.css}">

  </style>
</head>
<body>

  <main>
    <div class="registration-container">
      <h2>Supplier Registration</h2>
	  <form th:action="@{/fragip/admin/logout}" method="post">
	  										<button id="logoutBtn" type="submit"><i class="fas fa-sign-out-alt"></i> Home</button> 
	  																			               </form>  / <span>OPS</span>
      <form id="supplierForm" th:action="@{supplier}" method="post" th:object="${register}">
        <div class="mb-3">
          <label for="name" class="form-label">Company Name</label>
          <input type="text" id="name" name="supplierName" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="contact" class="form-label">Contact Number</label>
          <input type="tel" id="contact" name="phoneNumber" class="form-control" required>
        </div>
		<div class="mb-3">
		          <label for="city" class="form-label">streetName</label>
		          <input type="text" id="city" name="streetName" class="form-control" required>
		        </div>
				<div class="mb-3">
				          <label for="city" class="form-label">P.O.BOX</label>
				          <input type="text" id="city" name="pobox" class="form-control" required>
				        </div>
        <div class="mb-3">
          <label for="city" class="form-label">City</label>
          <input type="text" id="city" name="city" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="province" class="form-label">Province</label>
          <input type="text" id="province" name="province" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="country" class="form-label">Country</label>
          <input type="text" id="country" name="country" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Register Supplier</button>
        <p class="mt-3 text-center">Already registered? 
          <a href="supplier-login.html" class="text-light">Login here</a>
        </p>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 FRAGIP LOGISTICS. All rights reserved.</p>
  </footer>

</body>
</html>
