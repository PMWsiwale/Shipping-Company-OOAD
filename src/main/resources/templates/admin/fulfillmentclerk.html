<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fulfillment Clerk Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/fulfillment.css}">
</head>

<body>
    <div class="dashboard-container">
        <header>
            <div class="header-title">
                <h1><i class="fas fa-box-open"></i> Fulfillment WorkSpace</h1>
            </div>
            <div class="user-profile" th:object="${employee}">
                <span th:text="${employee.firstName +' '+ employee.lastName}">Alex Jr</span>
				<p >Employee ID: <span id="employeeId" th:text="${employee.ssn}">RC-22179213</span></p>
				<p>Position: <span id="Position" th:text="${employee.position}">Order operator</span></p>
				<form th:action="@{/fragip/admin/logout}" method="post">
															<button id="logoutBtn" type="submit"><i class="fas fa-sign-out-alt"></i> Logout</button> 
																		               </form>

            </div>
        </header>

        <div class="section">
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('pending')">
                    <i class="fas fa-clock"></i> Pending Requests
                </div>
               <!--
				 <div class="tab" onclick="switchTab('history')">
                    <i class="fas fa-history"></i> Fulfillment History
                </div>
				-->
            </div>

            <!-- Pending Requests Tab -->
            <div id="pending-tab" class="tab-content active">
                <div class="section-header">
                    <h2><i class="fas fa-list"></i> Order Fulfillment Requests</h2>
                    <div class="search-box">
                        <input type="text" placeholder="Search orders...">
                        <button class="btn btn-primary">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Priority</th>
                                <th>Date Requested</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody th:if="${order != null}">
                            <tr  th:each="st: ${order}">
                                <td th:text="${st.orderID}"></td>
                                <td th:text="${st.firstName +''+ st.lastName}"> </td>
                                <td th:text="${st.itemNumber}"></td>
                                <td><span class="badge badge-warning">Medium</span></td>
                                <td th:text="${st.date}">2023-11-15</td>
                                <td><span class="badge badge-primary">Pending</span></td>
                                <td>
                                   
									<form th:action="@{'/fragip/admin/fulfil/' + ${st?.orderID}}" method="post">
														<input th:if="${st != null and st.orderID != null}" 
														 th:value="${st.orderID}" 
														  name="orderId" 
														  type="hidden">
														 <button  class="btn btn-primary" >
														 <i class="fas fa-eye"></i>View
														 </button>
								 </form></td>
                                </td>
                            </tr>
                            
                           
                        </tbody>
                    </table>
                </div>
