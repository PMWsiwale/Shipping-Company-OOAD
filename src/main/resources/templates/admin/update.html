<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">	
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Shipping Status</title>

    <style>
         :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --light: #f5f7fa;
            --dark: #2c3e50;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background-color: var(--primary-dark);
        }
        
        .status-card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .status-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .status-info p {
            margin-bottom: 5px;
        }
        
        .status-info strong {
            color: var(--primary-dark);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
        }
        
        .btn-secondary {
            background-color: #ddd;
            color: var(--dark);
        }
        
        .btn-secondary:hover {
            background-color: #ccc;
        }
        
        .notification-banner {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        
        @media (max-width: 600px) {
            .status-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Update Shipping Status</h1>
            <a href="ship.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
				
            </a>
        </header>

        <div class="notification-banner" id="notification-banner">
            <i class="fas fa-check-circle"></i> <span id="notification-message"></span>
        </div>

        <div class="status-card">
            <div class="status-info">
                <div>
                    <label>Order Number</label>
                    <p><strong id="order-id-display">#ZM45621</strong></p>
                </div>
                <div>
                    <label>Current Status</label>
                    <p><strong id="current-status-display">Processing</strong></p>
                </div>
                <div>
                    <label>Customer Name</label>
                    <p><strong id="customer-name-display">Chanda Mwape</strong></p>
                </div>
                <div>
                    <label>Last Updated</label>
                    <p><strong id="last-updated-display">2023-05-15 10:30 AM</strong></p>
                </div>
            </div>

            <form id="status-form">
                <div class="form-group">
                    <label for="new-status">Update Status*</label>
                    <select id="new-status" required>
                        <option value="">Select status</option>
                        <option value="processing">Processing</option>
                        <option value="in-transit">In Transit</option>
                        <option value="out-for-delivery">Out for Delivery</option>
                        <option value="delivered">Delivered</option>
                        <option value="returned">Returned</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Current Location*</label>
                    <input type="text" id="location" required placeholder="Enter current location">
                </div>

                <div class="form-group">
                    <label for="notes">Additional Notes</label>
                    <textarea id="notes" rows="3" placeholder="Any additional information"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="btn btn-secondary">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Status
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Get order ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');

        // Sample data - in a real app, this would come from an API
        const sampleShipment = {
            orderId: orderId || "ZM45621",
            customer: "Chanda Mwape",
            currentStatus: "processing",
            lastUpdated: new Date().toLocaleString(),
            location: "Lusaka Warehouse"
        };

        // Populate the form with shipment data
        document.getElementById('order-id-display').textContent = `#${sampleShipment.orderId}`;
        document.getElementById('current-status-display').textContent =
            sampleShipment.currentStatus.charAt(0).toUpperCase() + sampleShipment.currentStatus.slice(1);
        document.getElementById('customer-name-display').textContent = sampleShipment.customer;
        document.getElementById('last-updated-display').textContent = sampleShipment.lastUpdated;
        document.getElementById('location').value = sampleShipment.location;

        // Form submission
        document.getElementById('status-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const status = document.getElementById('new-status').value;
            const location = document.getElementById('location').value;
            const notes = document.getElementById('notes').value;

            if (!status || !location) {
                showNotification('Please fill in all required fields', 'error');
                return;
            }

            // In a real app, you would send this data to the server
            console.log('Status update:', {
                orderId: sampleShipment.orderId,
                status: status,
                location: location,
                notes: notes
            });

            showNotification('Status updated successfully!');

            // Update display
            document.getElementById('current-status-display').textContent =
                status.charAt(0).toUpperCase() + status.slice(1);
            document.getElementById('last-updated-display').textContent = new Date().toLocaleString();
        });

        // Cancel button
        document.getElementById('cancel-btn').addEventListener('click', function() {
            if (confirm('Discard changes?')) {
                window.location.href = 'shipping.html';
            }
        });

        // Helper function to show notifications
        function showNotification(message, type = 'success') {
            const banner = document.getElementById('notification-banner');
            const messageEl = document.getElementById('notification-message');

            messageEl.textContent = message;

            // Set appropriate styling based on type
            if (type === 'error') {
                banner.style.backgroundColor = '#f8d7da';
                banner.style.color = '#721c24';
            } else {
                banner.style.backgroundColor = '#d4edda';
                banner.style.color = '#155724';
            }

            banner.style.display = 'flex';
            banner.style.gap = '10px';
            banner.style.alignItems = 'center';

            // Hide after 5 seconds
            setTimeout(() => {
                banner.style.display = 'none';
            }, 5000);
        }
    </script>
</body>

</html>
